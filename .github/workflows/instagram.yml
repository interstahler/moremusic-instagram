{"name": "Oppdater Instagram-feed", "on": {"schedule": [{"cron": "17 5 * * *"}], "workflow_dispatch": {}}, "permissions": {"contents": "write"}, "concurrency": "instagram-feed", "jobs": {"update": {"runs-on": "ubuntu-latest", "steps": [{"uses": "actions/checkout@v4"}, {"uses": "actions/setup-node@v4", "with": {"node-version": 20}}, {"name": "Hent innlegg og bilder", "run": "node scripts/fetch-instagram.mjs", "env": {"COMPOSIO_API_KEY": "${{ secrets.COMPOSIO_API_KEY }}", "COMPOSIO_ACCOUNT_ID": "${{ vars.COMPOSIO_ACCOUNT_ID }}", "PUBLIC_BASE": "${{ vars.PUBLIC_BASE }}"}}, {"name": "Commit endringer", "run": "git config user.name instagram-feed && git config user.email actions@users.noreply.github.com && git add docs/instagram && (git diff --cached --quiet && echo Ingen endringer || (git commit -m 'Oppdater Instagram-feed' && git push))"}]}}}
